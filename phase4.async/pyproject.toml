[project]
name = "federated-async-aggregation"
version = "1.0.0"
description = "Asynchronous Aggregation Federated SNN (Phase 5 / phase4.async)"
license = {text = "MIT"}

dependencies = [
    "flwr[simulation]==1.35.0",
    "torch==2.5.1",
    "snntorch",
    "tqdm",
    "numpy"
]

[tool.flwr.app]
publisher = "niya"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 50
fraction-train = 1.0
fraction-evaluate = 0.0
local-epochs = 5
batch-size = 32
learning-rate = 0.001


[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true